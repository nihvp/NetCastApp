<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NetCast Remote</title>
  <link rel="icon" type="image/png" href="assets/logo.png?v=2">
  <link rel="shortcut icon" href="assets/logo.png?v=2">
  <link rel="apple-touch-icon" href="assets/logo.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <div id="app">
    <!-- Auth Screen -->
    <div id="auth-screen" class="screen">
      <h1>NetCast TV Remote</h1>
      
      <div id="discovery-section" style="width: 100%; margin-top: 30px;">
        <button id="btn-discover" class="btn primary">Scan Network</button>
        <p id="discovery-status" style="margin-top: 14px;"></p>
      </div>

      <div id="manual-ip-section" style="width: 100%; margin-top: 16px;">
        <p style="margin-bottom: 8px;">Or connect manually</p>
        <input type="text" id="tv-ip" placeholder="192.168.x.x">
        <button id="btn-request-pin" class="btn">Connect</button>
      </div>

      <div id="pin-section" class="hidden" style="width: 100%; margin-top: 24px;">
        <p style="margin-bottom: 8px;">Enter PIN shown on TV</p>
        <input type="text" id="tv-pin" placeholder="PIN Code">
        <button id="btn-pair" class="btn primary">Pair Device</button>
      </div>
    </div>

    <!-- Remote Screen -->
    <div id="remote-screen" class="screen hidden" style="padding: 0;">
      
      <div class="header">
        <h2>NetCast Remote</h2>
        <button id="btn-show-app-settings" class="btn small" style="position: absolute; right: 20px; width: 38px; height: 38px; padding: 0; border-radius: 50%;"><i data-lucide="settings"></i></button>
      </div>

      <div class="scroll-container">
        <!-- Page 1: Main -->
        <div class="page">
          <div class="page-content">
            
            <div class="remote-row">
              <button class="btn remote-btn power" data-key="1"><i data-lucide="power"></i> Power</button>
              <button class="btn remote-btn" data-key="26">Mute</button>
            </div>

            <div class="dpad">
              <button class="btn remote-btn up" data-key="12" aria-label="Up"><i data-lucide="chevron-up"></i></button>
              <div class="dpad-middle">
                <button class="btn remote-btn left" data-key="14" aria-label="Left"><i data-lucide="chevron-left"></i></button>
                <button class="btn remote-btn ok" data-key="20">OK</button>
                <button class="btn remote-btn right" data-key="15" aria-label="Right"><i data-lucide="chevron-right"></i></button>
              </div>
              <button class="btn remote-btn down" data-key="13" aria-label="Down"><i data-lucide="chevron-down"></i></button>
            </div>
            
            <div class="rocker-row">
              <!-- Vol Rocker -->
              <div class="rocker">
                <button class="btn remote-btn rocker-half" data-key="24">Vol +</button>
                <button class="btn remote-btn rocker-half" data-key="25">Vol -</button>
              </div>
              
              <!-- Center Column -->
              <div class="center-col">
                <button class="btn remote-btn" data-key="21">Home</button>
                <button class="btn remote-btn" data-key="23">Back</button>
              </div>

              <!-- Ch Rocker -->
              <div class="rocker">
                <button class="btn remote-btn rocker-half" data-key="27">Ch +</button>
                <button class="btn remote-btn rocker-half" data-key="28">Ch -</button>
              </div>
            </div>

            <div class="remote-row">
              <button class="btn remote-btn" data-key="22">Settings</button>
              <button class="btn remote-btn" data-key="47">Input</button>
            </div>

            <div style="width: 100%;">
              <button id="btn-show-numpad" class="btn primary pill">Open Numpad</button>
            </div>

            <p style="margin-top: 8px; font-size: 12px; opacity: 0.5;">Swipe or click dots for more controls &rarr;</p>
          </div>
        </div>

        <!-- Page 2: Extras -->
        <div class="page">
          <div class="page-content">
            
            <div class="remote-row">
              <button class="btn remote-btn large" data-key="417">APPS</button>
              <button class="btn remote-btn large" data-key="412">EXIT</button>
            </div>
            
            <div class="remote-row">
              <button class="btn remote-btn large" data-key="45">INFO</button>
              <button class="btn remote-btn large" data-key="411">SEARCH</button>
            </div>

            <div class="color-grid">
              <button class="btn remote-btn color-btn" style="background: var(--danger)" data-key="31" aria-label="Red button">
                <div class="color-dot"></div>
              </button>
              <button class="btn remote-btn color-btn" style="background: #34c759" data-key="30" aria-label="Green button">
                <div class="color-dot"></div><div class="color-dot"></div>
              </button>
              <button class="btn remote-btn color-btn" style="background: #ffcc00" data-key="32" aria-label="Yellow button">
                <div class="color-dot"></div><div class="color-dot"></div><div class="color-dot"></div>
              </button>
              <button class="btn remote-btn color-btn" style="background: var(--accent)" data-key="29" aria-label="Blue button">
                <div class="color-dot"></div><div class="color-dot"></div><div class="color-dot"></div><div class="color-dot"></div>
              </button>
            </div>

            <div style="width: 100%;">
              <button id="btn-show-trackpad" class="btn primary pill">Open Trackpad</button>
            </div>
          </div>
        </div>

      </div>
      
      <div class="pagination">
        <button class="dot active" data-page="0" aria-label="Go to Page 1"></button>
        <button class="dot" data-page="1" aria-label="Go to Page 2"></button>
      </div>
    </div>
    
    <!-- App Settings Modal -->
    <div id="app-settings-modal" class="modal hidden">
      <div class="modal-content">
        <div class="header" style="padding: 0 0 16px 0;">
          <h2>App Settings</h2>
          <button id="btn-close-app-settings" class="btn small">Close</button>
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 16px; margin-top: 20px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 16px; font-weight: 500;">TV IP</span>
            <span id="settings-tv-ip" style="font-size: 16px; color: var(--text-secondary);">Not connected</span>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 16px; font-weight: 500;">Haptic Feedback</span>
            <input type="checkbox" id="toggle-haptics" checked style="width: auto; height: 24px; margin: 0; box-shadow: none;">
          </div>
          
          <div style="height: 1px; background: var(--text-secondary); opacity: 0.2; margin: 8px 0;"></div>
          
          <button id="btn-disconnect" class="btn" style="color: var(--danger); font-weight: 600;">Disconnect TV</button>
        </div>
      </div>
    </div>

    <!-- Numpad Modal -->
    <div id="numpad-modal" class="modal hidden">
      <div class="modal-content">
        <div class="header">
          <h2>Numpad</h2>
          <button id="btn-close-numpad" class="btn small">Close</button>
        </div>
        <div class="numpad-grid">
          <button class="btn remote-btn num-btn" data-key="3">1</button>
          <button class="btn remote-btn num-btn" data-key="4">2</button>
          <button class="btn remote-btn num-btn" data-key="5">3</button>
          <button class="btn remote-btn num-btn" data-key="6">4</button>
          <button class="btn remote-btn num-btn" data-key="7">5</button>
          <button class="btn remote-btn num-btn" data-key="8">6</button>
          <button class="btn remote-btn num-btn" data-key="9">7</button>
          <button class="btn remote-btn num-btn" data-key="10">8</button>
          <button class="btn remote-btn num-btn" data-key="11">9</button>
          <div class="empty"></div>
          <button class="btn remote-btn num-btn" data-key="2">0</button>
          <div class="empty"></div>
        </div>
      </div>
    </div>

    <!-- Trackpad Modal -->
    <div id="trackpad-modal" class="modal hidden">
      <div class="modal-content trackpad-container">
        <div class="header" style="margin-bottom: 20px;">
          <h2>Magic Trackpad</h2>
          <button id="btn-close-trackpad" class="btn small">Close</button>
        </div>
        <div id="trackpad-surface" class="trackpad-surface">
          <p>Drag to move<br>Tap to click</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="app.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
